<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- viewport：让页面在手机上也能正常缩放，不会把输入框挤变形 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园知识库问答</title>
    <!-- 样式表放在 frontend/ 一层，通过 FastAPI 的 /static 挂载点访问 -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- container：整页的"手机壳"，从上到下分成 头部 / 消息区 / 输入区 三块 -->
    <div class="container">

        <!-- ========== 头部：标题 + 清空按钮（CARD-3.3） ========== -->
        <!-- 用 header-text 包住文字，这样和右侧的清空按钮可以用 flex 左右分开 -->
        <header class="header">
            <div class="header-text">
                <h1>🏫 校园知识库问答</h1>
                <p class="subtitle">基于 RAG 的重庆移通学院信息助手</p>
            </div>
            <!-- 清空对话按钮：type="button" 防止在表单里被当成提交按钮 -->
            <button id="clear-btn" class="clear-btn" type="button">清空对话</button>
        </header>

        <!-- ========== 消息区：所有问答气泡都往这里塞（CARD-3.1 / 3.2 / 3.4） ========== -->
        <!-- 用 main 标签代替原来的 div，语义上表示"页面的主要内容"；
             初始为空，由 app.js 在页面加载时塞一条欢迎语 -->
        <main id="messages" class="messages"></main>

        <!-- ========== 输入区 ========== -->
        <div class="input-area">
            <input
                type="text"
                id="question-input"
                placeholder="问我学校的事，比如：学校在哪个城市？"
                autocomplete="off"
            />
            <!-- type="button" 同样是防止被当作表单提交按钮 -->
            <button id="send-btn" class="send-btn" type="button">发送</button>
        </div>
    </div>

    <!-- 脚本放在最后：保证执行时上面的 DOM 元素都已经存在，getElementById 才拿得到 -->
    <script src="/static/app.js"></script>
</body>
</html>
