name: 每日爬虫更新

on:
  schedule:
    - cron: '0 2 * * *'   # 每天 UTC 2:00（北京时间 10:00）
  workflow_dispatch:       # 支持手动触发

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 允许提交回仓库
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 装依赖
        run: pip install -r requirements.txt

      - name: 跑爬虫
        run: python -m scripts.crawler

      - name: 暂存爬取结果
        run: git add data/crawled_data_full.txt

      - name: 检查产出是否更新
        run: |
          if git diff --cached --quiet -- data/crawled_data_full.txt; then
            echo "::error::data/crawled_data_full.txt 未更新，请检查 scripts/crawler.py 的写出路径（见 CARD-1.6.3）"
            exit 1
          fi

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && git diff --staged --quiet || git commit -m "自动更新爬虫数据 $(date +'%Y-%m-%d')"
          git push
